<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ありがとうカウンター</title>
<meta name="description" content="「ありがとう」を声で数えて、50万回で50輪の花を咲かせるアプリ">
<meta name="theme-color" content="#F3F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C2420" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ありがとう">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>ありがとうカウンター</h1>
      <p class="date" id="date"></p>
    </div>
    <div class="top-actions">
      <a class="help-btn" href="help.html">使い方</a>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="設定とバックアップ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </header>

  <!-- 合計：タップで +1。リングは次の花までの進み具合 -->
  <section class="hero">
    <button class="counter" id="tapBtn" type="button" aria-label="ありがとうを1回数える">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="face" cx="50" cy="50" r="46"/>
        <circle class="prog" id="ringProg" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      </svg>
      <span class="inner">
        <span class="label">これまでのありがとう</span>
        <span class="num" id="total">0</span>
        <span class="tap-hint">タップで ＋1</span>
      </span>
    </button>

    <p class="next" id="nextText"></p>

    <dl class="stats">
      <div><dt>今日</dt><dd id="today">0</dd></div>
      <div><dt>咲いた花</dt><dd><span id="bloomed">0</span><small> / 50</small></dd></div>
      <div><dt>50万回まで</dt><dd id="goalPct">0%</dd></div>
    </dl>
    <div class="track" aria-hidden="true"><div class="fill" id="goalFill"></div></div>
  </section>

  <section class="voice">
    <button class="mic" id="micBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="micLabel">声でかぞえる</span>
    </button>
    <p class="heard" id="heard" aria-live="polite">ボタンを押して「ありがとう」と言うと数が増えます</p>
    <div class="actions">
      <button class="pill" id="undoBtn" type="button" disabled>ひとつ戻す</button>
      <button class="pill" id="bulkBtn" type="button">まとめて足す</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>この1週間</h2><span class="sub" id="weekSum"></span></div>
    <div class="week" id="week"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>ありがとうの花畑</h2><span class="sub">1万回ごとに1輪</span></div>
    <div class="garden" id="garden"></div>
    <p class="hint">花やつぼみをタップすると「自分へのごほうび」をメモできます</p>
  </section>

  <footer class="foot">
    <a class="link" href="help.html">使い方</a>
    <button class="link" id="backupLink" type="button">バックアップ／復元</button>
  </footer>
</div>

<!-- まとめて足す -->
<dialog id="bulkDialog" class="sheet">
  <form method="dialog" id="bulkForm">
    <h3>まとめて足す</h3>
    <p class="muted">ほかの場所で数えた分などを、今日の回数に足します。</p>
    <label class="field">
      <span>回数</span>
      <input id="bulkInput" type="number" inputmode="numeric" min="1" max="500000" step="1" placeholder="100" required>
    </label>
    <div class="chips">
      <button type="button" class="chip" data-add="10">+10</button>
      <button type="button" class="chip" data-add="50">+50</button>
      <button type="button" class="chip" data-add="100">+100</button>
      <button type="button" class="chip" data-add="1000">+1000</button>
    </div>
    <div class="dialog-actions">
      <button class="pill" value="cancel" formnovalidate>やめる</button>
      <button class="pill primary" value="ok">足す</button>
    </div>
  </form>
</dialog>

<!-- ごほうびメモ -->
<dialog id="rewardDialog" class="sheet">
  <form method="dialog" id="rewardForm">
    <div class="reward-art" id="rewardArt"></div>
    <h3 id="rewardTitle"></h3>
    <p class="muted" id="rewardSub"></p>
    <label class="field">
      <span>自分へのごほうび</span>
      <textarea id="rewardInput" rows="3" maxlength="200" placeholder="例：好きなケーキを買う／温泉に行く"></textarea>
    </label>
    <div class="dialog-actions">
      <button class="pill" value="cancel" formnovalidate>閉じる</button>
      <button class="pill primary" value="ok">保存</button>
    </div>
  </form>
</dialog>

<!-- 設定・バックアップ -->
<dialog id="menuDialog" class="sheet">
  <form method="dialog">
    <h3>設定とバックアップ</h3>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="soundToggle"><span>お祝いの音</span></label>
      <label class="toggle"><input type="checkbox" id="vibrateToggle"><span>振動</span></label>
    </div>

    <h4>バックアップ</h4>
    <p class="muted">記録はこの端末の中だけに保存されています。機種変更やブラウザのデータ削除に備えて、ときどき保存しておくと安心です。</p>
    <div class="stack">
      <button type="button" class="pill" id="exportBtn">ファイルに保存</button>
      <button type="button" class="pill" id="copyBtn">文字でコピー</button>
    </div>

    <h4>復元</h4>
    <div class="stack">
      <label class="pill file-pill">ファイルから復元<input type="file" id="importFile" accept="application/json,.json"></label>
      <button type="button" class="pill" id="pasteToggle">文字を貼りつけて復元</button>
    </div>
    <div id="pasteBox" hidden>
      <textarea id="pasteInput" rows="4" class="mono" placeholder="コピーしたバックアップの文字を貼りつけ"></textarea>
      <button type="button" class="pill primary" id="pasteRestore">この内容で復元</button>
    </div>
    <p class="muted small" id="backupMsg" role="status"></p>

    <h4>リセット</h4>
    <p class="muted">数をゼロに戻して、はじめから数えなおします。</p>
    <div class="stack">
      <button type="button" class="pill danger-outline" id="resetToggle">数をゼロに戻す…</button>
      <button type="button" class="pill" id="undoResetBtn" hidden></button>
    </div>
    <div class="danger-box" id="resetBox" hidden>
      <p class="danger-text" id="resetSummary"></p>
      <label class="toggle"><input type="checkbox" id="keepRewards" checked><span>ごほうびメモは残す</span></label>
      <div class="stack">
        <button type="button" class="pill danger" id="resetConfirm">ゼロに戻す</button>
        <button type="button" class="pill" id="resetCancel">やめる</button>
      </div>
    </div>
    <p class="muted small" id="resetMsg" role="status"></p>

    <div class="dialog-actions">
      <button class="pill" value="close">閉じる</button>
    </div>
  </form>
</dialog>

<!-- お祝い -->
<div class="celebrate" id="celebrate" hidden>
  <div class="celebrate-card" role="dialog" aria-modal="true" aria-labelledby="celebrateTitle">
    <div class="celebrate-art" data-art></div>
    <p class="kicker" data-kicker></p>
    <p class="celebrate-title" id="celebrateTitle" data-title></p>
    <p class="celebrate-msg" data-message></p>
    <p class="celebrate-reward" data-reward hidden></p>
    <div class="dialog-actions center">
      <button class="pill" type="button" data-action hidden></button>
      <button class="pill primary" type="button" data-ok>うれしい！</button>
    </div>
  </div>
</div>

<!-- 1,000回ごとのお知らせ -->
<div class="banner" id="banner" role="status" aria-live="polite" hidden>
  <div class="banner-art" data-art></div>
  <div>
    <p class="banner-title" data-title></p>
    <p class="banner-msg" data-message></p>
  </div>
</div>

<canvas class="rain" id="rain" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
